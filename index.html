<script>
// ================ MASTER DATA ================
const MASTER = {
  PUSHER_CARS: ["CP 9-0","CP 9-1","CP 9-2","CP 10-3"],
  CHARGING_CARS: ["CC 9-1","CC 9-2","CC 10-3","CC 10-4"],
  DOOR_EXTRACTORS: ["DE 9-1","DE 9-2","DE 10-3","DE 10-4"],
  QUENCHING_CARS: ["QC 9 inner","QC 9 outer","QC 10 inner","QC 10 outer"],
  TRACKS_WHARFS: ["Wharf 5","Wharf 6","1st Track","2nd Track"],
  SHIFTS: ["A","B","C"],
  BATTERIES: ["9","10"],
  BLAST_FURNACES: ["BF-4","BF-6","BF-7","BF-8"],
  OVEN_JOBS: ["Door Change","AFDF","Top Lintel","Bottom Lintel","Jamb Bricks","Door Frame","Armour Frame","Sole Brick","Stand Pipe","Valve Box","Hatch Cover","Hatch Ring","Goose Neck"],
  RAIL_TRACKS: ["Pusher Track","Charging Car Track","Door Extractor Track","Quenching Car Track"],
  PPM_HALVES: ["1st Half","2nd Half","Full Day"],
  SHIFT_TIMES: {A:{start:6,end:14,label:"06:00 – 14:00"},B:{start:14,end:22,label:"14:00 – 22:00"},C:{start:22,end:6,label:"22:00 – 06:00"}},
  CQ_PARAMS: [
    {key:"moisture",label:"Moisture (%)",color:"#3b82f6"},
    {key:"csr",label:"CSR",color:"#16a34a"},
    {key:"cri",label:"CRI",color:"#dc2626"},
    {key:"m10",label:"M10",color:"#f59e0b"},
    {key:"m40",label:"M40",color:"#0f2942"},
  ],
  DEFAULT_COALS: ["PCC","MCC","AUS (H)","USA (H)","BENGA (H)","LVHR","MLV","MABU","AUS (S)","USA (S)","RUSSIA (S)"],
  JOB_SIDES: {
    "Door Change":["Pusher Side","Coke Side"],"AFDF":["Pusher Side","Coke Side"],
    "Top Lintel":["Pusher Side","Coke Side"],"Bottom Lintel":["Pusher Side","Coke Side"],
    "Jamb Bricks":["Pusher Side","Coke Side"],"Door Frame":["Pusher Side","Coke Side"],
    "Armour Frame":["Pusher Side","Coke Side"],"Sole Brick":["Pusher Side","Coke Side"],
    "Stand Pipe":["Pusher Side","Coke Side"],"Valve Box":["Pusher Side","Coke Side"],
    "Hatch Cover":["Pusher Side","Middle Side","Coke Side"],
    "Hatch Ring":["Pusher Side","Middle Side","Coke Side"],"Goose Neck":["Pusher Side","Coke Side"],
  }
};
// Combined equipment list for Today's Plan (PPM + Wharfs + Tracks)
MASTER.ALL_EQUIPMENT = [...MASTER.PUSHER_CARS, ...MASTER.CHARGING_CARS, ...MASTER.DOOR_EXTRACTORS, ...MASTER.QUENCHING_CARS, ...MASTER.TRACKS_WHARFS];

// ================ OVEN SEQUENCE ================
const SERIES = {
  1:[1,6,11,16,21,26,31,36,41,46,51,56,61,66],
  2:[3,8,13,18,23,28,33,38,43,48,53,58,63,67],
  3:[5,10,15,20,25,30,35,40,45,50,55,60,65],
  4:[2,7,12,17,22,27,32,37,42,47,52,57,62],
  5:[4,9,14,19,24,29,34,39,44,49,54,59,64],
};
const SERIES_ORDER = [1,2,3,4,5];
function relativeToPhysical(rel,b){ return b==="9" ? 900+rel : 1000+rel; }
function physicalToRelative(p,b){ return b==="9" ? p-900 : p-1000; }
function findSeriesPosition(rel){ for(const s of SERIES_ORDER){ const i=SERIES[s].indexOf(rel); if(i!==-1) return {series:s,indexInSeries:i}; } return null; }
function generateSequence(startPos,count){
  const out=[]; let sIdx=0,iIdx=0;
  if(startPos){
    sIdx=SERIES_ORDER.indexOf(startPos.series);
    iIdx=startPos.indexInSeries+1;
    if(iIdx>=SERIES[SERIES_ORDER[sIdx]].length){ iIdx=0; sIdx=(sIdx+1)%SERIES_ORDER.length; }
  }
  while(out.length<count){
    const sn=SERIES_ORDER[sIdx], arr=SERIES[sn];
    out.push({relative:arr[iIdx],series:sn,indexInSeries:iIdx});
    iIdx++;
    if(iIdx>=arr.length){ iIdx=0; sIdx=(sIdx+1)%SERIES_ORDER.length; }
  }
  return out;
}
function spreadTimes(startTime,count,shiftMin=480){
  const [h,m]=startTime.split(":").map(Number);
  const startMins=h*60+m, interval=shiftMin/count, times=[];
  for(let i=0;i<count;i++){
    const t=Math.round(startMins+i*interval);
    times.push(`${String(Math.floor((t/60)%24)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`);
  }
  return times;
}

  const el=document.getElementById("toast");
  el.textContent=msg; el.className="toast show "+type;
  setTimeout(()=>el.classList.remove("show"),3000);
}
function showAuthMsg(m,t="error"){ document.getElementById("authMsg").innerHTML=`<div class="msg ${t}">${m}</div>`; }
function esc(s){ return (s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function yesterdayISO(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function last7Days(){ const a=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); a.push(d.toISOString().slice(0,10)); } return a; }
function nowHHMM(){ const d=new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function initials(n){ return (n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function currentShift(){ const h=new Date().getHours(); if(h>=6&&h<14) return "A"; if(h>=14&&h<22) return "B"; return "C"; }
function canEdit(tab){
  const r=state.profile?.role; if(!r) return false; if(r==="admin") return true;
  const map={logbook:["shift_incharge"],schedule:["hr"],quality:["hr"]};
  return (map[tab]||[]).includes(r);
}
function canView(tab){
  const r=state.profile?.role; if(!r) return false; if(r==="admin") return true;
  if(r==="hr") return ["dashboard","schedule","quality"].includes(tab);
  if(r==="shift_incharge") return ["dashboard","logbook"].includes(tab);
  return false;
}

async function doSignUp(){

function initAuthListener(){
  FB.onAuthStateChanged(FB.auth, async (user)=>{
    if(!user){ document.getElementById("authScreen").classList.remove("hidden"); document.getElementById("pendingScreen").classList.add("hidden"); document.getElementById("app").style.display="none"; return; }
    const snap=await FB.getDoc(FB.doc(FB.db,"users",user.uid));
    if(!snap.exists()){ document.getElementById("authScreen").classList.add("hidden"); document.getElementById("pendingScreen").classList.remove("hidden"); return; }
    const profile=snap.data();
    state.user={uid:user.uid,email:user.email}; state.profile=profile;
    if(profile.status!=="approved"){ document.getElementById("authScreen").classList.add("hidden"); document.getElementById("pendingScreen").classList.remove("hidden"); document.getElementById("app").style.display="none"; return; }
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("pendingScreen").classList.add("hidden");
    document.getElementById("app").style.display="block";
    document.getElementById("userName").textContent=profile.name;
    document.getElementById("userMeta").textContent=profile.designation+" · "+profile.role.replace("_"," ");
    document.getElementById("userAvatar").textContent=initials(profile.name);

async function loadDashboardShift(){
  const shift=currentShift(), t=MASTER.SHIFT_TIMES[shift];
  document.getElementById("dashShift").textContent="Shift "+shift;
  document.getElementById("dashShiftTime").textContent=t.label;
  try{
    const today=todayISO();
    const snap=await FB.getDocs(FB.collection(FB.db,"logbook"));

    if(entry){
      const phone=entry.inchargePhone||"";
      const last4=phone?phone.slice(-4):"----";
      document.getElementById("dashShiftIncharge").textContent=`Incharge: ${entry.inchargeName||"—"} (…${last4})`;
    }else{
      document.getElementById("dashShiftIncharge").textContent="Incharge: not yet entered";
    }
  }catch(e){}
}

async function loadDashboardBatteryKPI(){
  const shift=currentShift(), today=todayISO();
  for(const b of ["9","10"]){
    try{
      const schedSnap=await FB.getDocs(FB.collection(FB.db,"ovenSchedules"));
      const sched=schedSnap.docs.map(d=>d.data()).find(d=>d.shift_date===today&&d.shift===shift&&d.battery===b);
      const total=sched?(sched.ovens||[]).length:0;
      const logSnap=await FB.getDocs(FB.collection(FB.db,"logbook"));
      const log=logSnap.docs.map(d=>d.data()).find(d=>d.shift_date===today&&d.shift===shift&&d.battery===b);
      const pushed=log?(log.ovensScheduled||[]).filter(o=>o.pushedBy).length:0;
      document.getElementById(b==="9"?"dashB9PS":"dashB10PS").textContent=`${pushed} / ${total}`;
    }catch(e){}
  }
}

async function renderBatteryPanel(battery,date){
  const el=document.getElementById(`dashPanel${battery}`);
  if(!el) return;
  try{
    const schedSnap=await FB.getDocs(FB.collection(FB.db,"ovenSchedules"));
    const batteryScheds=schedSnap.docs.map(d=>d.data()).filter(d=>d.shift_date===date&&d.battery===battery);
    const logSnap=await FB.getDocs(FB.collection(FB.db,"logbook"));
    const batteryLogs=logSnap.docs.map(d=>d.data()).filter(d=>d.shift_date===date&&d.battery===battery);
    let totalSched=0, totalPushed=0;
    batteryScheds.forEach(s=>{ totalSched+=(s.ovens||[]).length; });
    batteryLogs.forEach(l=>{ totalPushed+=(l.ovensScheduled||[]).filter(o=>o.pushedBy).length; });
    const pct=totalSched?Math.round((totalPushed/totalSched)*100):0;
    const showSched=state.dashSchedView[battery];
    el.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div><div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;">Ovens Pushed</div>
          <div style="font-size:28px;font-weight:800;color:var(--navy);">${totalPushed} <span style="font-size:16px;color:var(--muted);">/ ${totalSched}</span></div></div>
        <div style="text-align:right;"><div style="font-size:12px;color:var(--muted);">Completion</div>
          <div style="font-size:22px;font-weight:700;color:${pct>=80?"var(--green)":pct>=50?"var(--amber)":"var(--red)"};">${pct}%</div></div>
      </div>

        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--blue),var(--navy));transition:.4s;"></div>
      </div>
      ${showSched?`
        <div style="max-height:300px;overflow-y:auto;">
          ${batteryScheds.length?batteryScheds.map(s=>`
            <div style="margin-bottom:12px;">

            </div>`).join(""):`<div style="color:var(--muted);font-size:13px;">No schedule for this day.</div>`}
        </div>`:``}
    `;
  }catch(e){ el.innerHTML=`<div class="msg error">${esc(e.message)}</div>`; }

async function loadExistingLogbook(){
  const date=document.getElementById("lb-date").value;
  const shift=document.getElementById("lb-shift").value;
  state.logbookRows9=[]; state.logbookRows10=[];
  state.logbookLoaded9=false; state.logbookLoaded10=false;
  state.extraOvens9=[]; state.extraOvens10=[];
  state.leftOvens9={pushed:[],uncharged:[]}; state.leftOvens10={pushed:[],uncharged:[]};
  document.getElementById("lbSched9").innerHTML=`<div style="color:var(--muted);font-size:13px;">Click Load Schedules</div>`;
  document.getElementById("lbSched10").innerHTML=`<div style="color:var(--muted);font-size:13px;">Click Load Schedules</div>`;
  renderExtraOvens("9"); renderExtraOvens("10");
  renderLeftOvens("9"); renderLeftOvens("10");
  try{
    const id9=`${date}_${shift}_9`, id10=`${date}_${shift}_10`;
    const [s9,s10]=await Promise.all([FB.getDoc(FB.doc(FB.db,"logbook",id9)),FB.getDoc(FB.doc(FB.db,"logbook",id10))]);
    const d9=s9.exists()?s9.data():null, d10=s10.exists()?s10.data():null;
    if(!d9&&!d10){ toast("No existing entry for this date/shift — you can create new","info"); return; }
    const primary=d9||d10;
    const set=(id,v)=>{ const el=document.getElementById(id); if(el&&v!==undefined&&v!==null) el.value=v; };
    set("lb-phone",primary.inchargePhone); set("lb-incharge",primary.inchargeName); set("lb-incharge-desig",primary.inchargeDesignation);
    set("lb-bsp",primary.manpower?.bsp); set("lb-hotjob",primary.manpower?.hotJob); set("lb-pvt",primary.manpower?.privateOperators);
    ["p1","p2","p3","p4"].forEach(k=>{
      set("lb-ct5-"+k,primary.pocketStart?.ct5?.[k]); set("lb-ct6-"+k,primary.pocketStart?.ct6?.[k]);
      set("lb-ct5e-"+k,primary.pocketEnd?.ct5?.[k]); set("lb-ct6e-"+k,primary.pocketEnd?.ct6?.[k]);
    });
    set("lb-ac",primary.equipmentAC);
    set("lb-wharf5",primary.wharf?.wharf5); set("lb-wharf6",primary.wharf?.wharf6);
    if(d9){
      state.logbookRows9=d9.ovensScheduled||[];
      state.logbookLoaded9=state.logbookRows9.length>0;
      state.extraOvens9=d9.extraOvens||[];
      state.leftOvens9={pushed:d9.ovensLeftPushed||[],uncharged:d9.ovensLeftUncharged||[]};
    }
    if(d10){
      state.logbookRows10=d10.ovensScheduled||[];
      state.logbookLoaded10=state.logbookRows10.length>0;
      state.extraOvens10=d10.extraOvens||[];
      state.leftOvens10={pushed:d10.ovensLeftPushed||[],uncharged:d10.ovensLeftUncharged||[]};
    }
    renderExtraOvens("9"); renderExtraOvens("10");
    renderLeftOvens("9"); renderLeftOvens("10");
    if(state.logbookLoaded9) renderLogbookSchedRows("9");
    if(state.logbookLoaded10) renderLogbookSchedRows("10");
    toast(`Loaded existing entry for ${date} shift ${shift}`,"success");
  }catch(e){ console.warn(e); }
}

function renderExtraOvens(battery){
  const el=document.getElementById(`lbExtra${battery}`); if(!el) return;
  const list=battery==="9"?state.extraOvens9:state.extraOvens10;
  if(!list.length){ el.innerHTML=`<div style="color:var(--muted);font-size:13px;">No extra ovens.</div>`; return; }
  const machines={pushed:MASTER.PUSHER_CARS,door:MASTER.DOOR_EXTRACTORS,charged:MASTER.CHARGING_CARS};
  el.innerHTML=list.map((o,i)=>`
    <div class="row-card">
      <div class="grid grid-4" style="gap:6px;margin-bottom:6px;">
        <input type="number" placeholder="Oven No" value="${esc(o.ovenNo||"")}" oninput="setExtra('${battery}',${i},'ovenNo',this.value)" />
        <input type="time" value="${esc(o.pushTime||"")}" oninput="setExtra('${battery}',${i},'pushTime',this.value)" />
        <input type="number" step="0.1" placeholder="Amperage" value="${esc(o.amperage||"")}" oninput="setExtra('${battery}',${i},'amperage',this.value)" />
        <button class="small danger" onclick="removeExtraOven('${battery}',${i})">✕</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Pushed By:</div>
      <div class="machine-cell" style="margin-bottom:6px;">
        ${machines.pushed.map(m=>`<button class="machine-btn ${o.pushedBy===m?"selected":""}" onclick="setExtra('${battery}',${i},'pushedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Door Extracted By:</div>
      <div class="machine-cell" style="margin-bottom:6px;">
        ${machines.door.map(m=>`<button class="machine-btn ${o.doorExtractedBy===m?"selected":""}" onclick="setExtra('${battery}',${i},'doorExtractedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Charged By:</div>
      <div class="machine-cell">
        ${machines.charged.map(m=>`<button class="machine-btn ${o.chargedBy===m?"selected":""}" onclick="setExtra('${battery}',${i},'chargedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
      </div>
    </div>
  `).join("");
}
function setExtra(battery,i,key,val){
  const list=battery==="9"?state.extraOvens9:state.extraOvens10;
  if(!list[i]) return;
  list[i][key]=val;
  if(key!=="ovenNo"&&key!=="pushTime"&&key!=="amperage") renderExtraOvens(battery);
}
function addExtraOven(battery){
  const list=battery==="9"?state.extraOvens9:state.extraOvens10;
  list.push({ovenNo:"",pushTime:nowHHMM(),amperage:"",pushedBy:"",doorExtractedBy:"",chargedBy:""});
  renderExtraOvens(battery);
}
function removeExtraOven(battery,i){
  const list=battery==="9"?state.extraOvens9:state.extraOvens10;
  list.splice(i,1); renderExtraOvens(battery);
}

function renderLeftOvens(battery){
  const stateObj=battery==="9"?state.leftOvens9:state.leftOvens10;
  ["pushed","uncharged"].forEach(kind=>{
    const el=document.getElementById(`lbLeft${battery}${kind==="pushed"?"Pushed":"Uncharged"}`);
    if(!el) return;
    const list=stateObj[kind];
    if(!list.length){ el.innerHTML=`<div style="color:var(--muted);font-size:13px;">None</div>`; return; }
    el.innerHTML=list.map((o,i)=>`
      <div class="row" style="gap:6px;margin-bottom:6px;">
        <input type="number" placeholder="Oven No" value="${esc(o||"")}" oninput="setLeft('${battery}','${kind}',${i},this.value)" />
        <button class="small danger" onclick="removeLeftOven('${battery}','${kind}',${i})">✕</button>
      </div>
    `).join("");
  });
}
function setLeft(battery,kind,i,val){
  const stateObj=battery==="9"?state.leftOvens9:state.leftOvens10;
  stateObj[kind][i]=val;
}
function addLeftOven(battery,kind){
  const stateObj=battery==="9"?state.leftOvens9:state.leftOvens10;
  stateObj[kind].push(""); renderLeftOvens(battery);
}
function removeLeftOven(battery,kind,i){
  const stateObj=battery==="9"?state.leftOvens9:state.leftOvens10;
  stateObj[kind].splice(i,1); renderLeftOvens(battery);
}

async function loadLogbookSchedules(){
  const date=document.getElementById("lb-date").value;
  const shift=document.getElementById("lb-shift").value;
  try{
    for(const battery of ["9","10"]){
      const q=FB.query(FB.collection(FB.db,"ovenSchedules"),FB.where("shift_date","==",date),FB.where("shift","==",shift),FB.where("battery","==",battery));
      const snap=await FB.getDocs(q);
      if(snap.empty){
        document.getElementById(`lbSched${battery}`).innerHTML=`<div style="color:var(--muted);font-size:13px;">No schedule for Battery ${battery}.</div>`;
        continue;
      }
      const data=snap.docs[0].data();
      const rows=data.ovens.map(o=>({ovenNo:o.ovenNo,pushTime:o.pushTime,isManual:!!o.isManual,pushedBy:"",doorExtractedBy:"",chargedBy:"",amperage:""}));
      if(battery==="9"){ state.logbookRows9=rows; state.logbookLoaded9=true; }
      else{ state.logbookRows10=rows; state.logbookLoaded10=true; }
      renderLogbookSchedRows(battery);
    }
    toast("Both schedules loaded","success");
  }catch(e){ toast("Load failed: "+e.message,"error"); }
}

function renderLogbookSchedRows(battery){
  const el=document.getElementById(`lbSched${battery}`); if(!el) return;
  const rows=battery==="9"?state.logbookRows9:state.logbookRows10;

  const machines={pushed:MASTER.PUSHER_CARS,door:MASTER.DOOR_EXTRACTORS,charged:MASTER.CHARGING_CARS};
  el.innerHTML=`
    <table style="font-size:11px;">
      <thead><tr><th>#</th><th>Oven</th><th>Time</th><th>Pushed By</th><th>Door</th><th>Charged</th><th>Amp</th></tr></thead>
      <tbody>${rows.map((r,i)=>`
        <tr>
          <td>${i+1}</td><td><b>${esc(r.ovenNo)}</b></td><td>${esc(r.pushTime)}</td>
          <td><div class="machine-cell">
            ${machines.pushed.map(m=>`<button class="machine-btn ${r.pushedBy===m?"selected":""}" onclick="pickLogbookMachine('${battery}',${i},'pushedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
            ${r.pushedBy?`<div class="chosen">→ ${esc(r.pushedBy)}</div>`:""}
          </div></td>
          <td><div class="machine-cell">
            ${machines.door.map(m=>`<button class="machine-btn ${r.doorExtractedBy===m?"selected":""}" onclick="pickLogbookMachine('${battery}',${i},'doorExtractedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
            ${r.doorExtractedBy?`<div class="chosen">→ ${esc(r.doorExtractedBy)}</div>`:""}
          </div></td>
          <td><div class="machine-cell">
            ${machines.charged.map(m=>`<button class="machine-btn ${r.chargedBy===m?"selected":""}" onclick="pickLogbookMachine('${battery}',${i},'chargedBy','${esc(m)}')">${esc(m)}</button>`).join("")}
            ${r.chargedBy?`<div class="chosen">→ ${esc(r.chargedBy)}</div>`:""}
          </div></td>
          <td><input type="number" step="0.1" value="${esc(r.amperage||"")}" placeholder="A" style="width:55px;" oninput="pickLogbookMachineAmp('${battery}',${i},this.value)" /></td>
        </tr>`).join("")}</tbody>
    </table>

function pickLogbookMachine(battery,i,key,machine){
  const rows=battery==="9"?state.logbookRows9:state.logbookRows10;
  rows[i][key]=rows[i][key]===machine?"":machine;
  renderLogbookSchedRows(battery);
}
function pickLogbookMachineAmp(battery,i,v){
  const rows=battery==="9"?state.logbookRows9:state.logbookRows10;
  rows[i].amperage=v;
}

async function saveLogbook(status){
  const p=state.profile;
  const date=document.getElementById("lb-date").value;
  const shift=document.getElementById("lb-shift").value;
  try{
    const breakdowns=[];
    document.querySelectorAll("#breakdownList > div").forEach(div=>{
      const m=div.querySelector(".bd-machine").value;
      const d=div.querySelector(".bd-desc").value;
      const st=div.querySelector(".bd-start").value;
      const en=div.querySelector(".bd-end").value;
      if(m||d) breakdowns.push({machine:m,description:d,startTime:st,endTime:en,ongoing:!en});
    });
    for(const battery of ["9","10"]){
      const loaded=battery==="9"?state.logbookLoaded9:state.logbookLoaded10;
      const rows=battery==="9"?state.logbookRows9:state.logbookRows10;
      const extra=battery==="9"?state.extraOvens9:state.extraOvens10;
      const left=battery==="9"?state.leftOvens9:state.leftOvens10;
      if(!loaded&&!extra.length&&!left.pushed.length&&!left.uncharged.length) continue;
      const docId=`${date}_${shift}_${battery}`;
      await FB.setDoc(FB.doc(FB.db,"logbook",docId),{
        shift_date:date,shift,battery,
        inchargeName:document.getElementById("lb-incharge").value,
        inchargeDesignation:document.getElementById("lb-incharge-desig").value,
        inchargePhone:document.getElementById("lb-phone").value,
        manpower:{bsp:Number(document.getElementById("lb-bsp").value||0),hotJob:Number(document.getElementById("lb-hotjob").value||0),privateOperators:Number(document.getElementById("lb-pvt").value||0)},
        pocketStart:{
          ct5:{p1:+document.getElementById("lb-ct5-p1").value||0,p2:+document.getElementById("lb-ct5-p2").value||0,p3:+document.getElementById("lb-ct5-p3").value||0,p4:+document.getElementById("lb-ct5-p4").value||0},
          ct6:{p1:+document.getElementById("lb-ct6-p1").value||0,p2:+document.getElementById("lb-ct6-p2").value||0,p3:+document.getElementById("lb-ct6-p3").value||0,p4:+document.getElementById("lb-ct6-p4").value||0}
        },
        equipmentAC:document.getElementById("lb-ac").value,
        ovensScheduled:rows,
        extraOvens:extra,
        ovensLeftPushed:left.pushed.map(x=>Number(x)||0).filter(x=>x>0),
        ovensLeftUncharged:left.uncharged.map(x=>Number(x)||0).filter(x=>x>0),
        breakdowns,
        wharf:{wharf5:document.getElementById("lb-wharf5").value,wharf6:document.getElementById("lb-wharf6").value},
        pocketEnd:{
          ct5:{p1:+document.getElementById("lb-ct5e-p1").value||0,p2:+document.getElementById("lb-ct5e-p2").value||0,p3:+document.getElementById("lb-ct5e-p3").value||0,p4:+document.getElementById("lb-ct5e-p4").value||0},
          ct6:{p1:+document.getElementById("lb-ct6e-p1").value||0,p2:+document.getElementById("lb-ct6e-p2").value||0,p3:+document.getElementById("lb-ct6e-p3").value||0,p4:+document.getElementById("lb-ct6e-p4").value||0}
        },
        status:status==="submit"?"submitted":"draft",
        createdBy:p.name,updatedBy:p.name,
        createdAt:FB.serverTimestamp(),updatedAt:FB.serverTimestamp()
      },{merge:true});
    }
    toast(status==="submit"?"Logbook SUBMITTED ✔":"Logbook saved","success");
  }catch(e){ toast("Save failed: "+e.message,"error"); }
}

async function viewLogbook(){
  const from=document.getElementById("lbv-from").value;
  const to=document.getElementById("lbv-to").value;
  const shiftFilter=document.getElementById("lbv-shift").value;
  const el=document.getElementById("lbv-results");
  el.innerHTML=`<div>Loading…</div>`;
  try{
    const snap=await FB.getDocs(FB.collection(FB.db,"logbook"));
    let docs=snap.docs.map(d=>d.data()).filter(d=>d.status==="submitted").filter(d=>d.shift_date>=from&&d.shift_date<=to);
    if(shiftFilter) docs=docs.filter(d=>d.shift===shiftFilter);
    docs.sort((a,b)=>((a.shift_date||"")+(a.shift||"")+(a.battery||"")).localeCompare((b.shift_date||"")+(b.shift||"")+(b.battery||"")));
    if(!docs.length){ el.innerHTML=`<div style="color:var(--muted);">No submitted logbooks.</div>`; return; }
    el.innerHTML=`
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Found ${docs.length} submitted logbook(s)</p>
      <table><thead><tr><th>Date</th><th>Shift</th><th>Battery</th><th>Incharge</th><th>Phone</th><th>Ovens</th><th>Actions</th></tr></thead>
      <tbody>${docs.map((d,i)=>`
        <tr><td>${esc(d.shift_date)}</td><td>${esc(d.shift)}</td><td>${esc(d.battery)}</td>
        <td>${esc(d.inchargeName||d.createdBy)}</td><td>${esc(d.inchargePhone||"—")}</td>
        <td>${(d.ovensScheduled||[]).length}</td>
        <td><button class="small secondary" onclick="openLogbookDoc(${i})">View</button></td></tr>`).join("")}</tbody></table>
      <div id="lbv-detail"></div>

function updateOven(i,key,val){
  if(key==="ovenNo"){
    const n=Number(val);
    state.generatedOvens[i].ovenNo=n;
    const battery=document.getElementById("sc-battery").value;
    const rel=physicalToRelative(n,battery);
    const pos=findSeriesPosition(rel);
    if(pos&&state.generatedOvens[i].expectedRelative===rel){
      state.generatedOvens[i].isManual=false;
      state.generatedOvens[i].seriesTag=pos.series;
    }else{
      state.generatedOvens[i].isManual=true;
      state.generatedOvens[i].seriesTag=null;
    }
  }else state.generatedOvens[i][key]=val;
}

async function findCursor(battery){
  try{
    const q=FB.query(FB.collection(FB.db,"ovenSchedules"),FB.where("battery","==",battery));
    const snap=await FB.getDocs(q);
    if(snap.empty) return null;
    const docs=snap.docs.map(d=>d.data());
    docs.sort((a,b)=>{
      const ta=a.createdAt?.seconds||0, tb=b.createdAt?.seconds||0;
      if(tb!==ta) return tb-ta;
      return (a.shift_date+a.shift).localeCompare(b.shift_date+b.shift);
    });
    const latest=docs[0];
    if(!latest.ovens) return null;
    for(let i=latest.ovens.length-1;i>=0;i--){
      const o=latest.ovens[i];
      if(!o.isManual){
        const rel=physicalToRelative(o.ovenNo,battery);
        const pos=findSeriesPosition(rel);
        if(pos) return pos;
      }
    }
    return null;
  }catch(e){ return null; }
}
async function generateSchedulePreview(){
  const total=Number(document.getElementById("sc-total").value);
  const start=document.getElementById("sc-start").value;
  const battery=document.getElementById("sc-battery").value;
  const startOvenInput=document.getElementById("sc-startOven").value;
  if(!total||total<1||total>67) return toast("Total ovens must be 1–67","error");
  if(!start) return toast("Set pushing start time","error");
  let cursor=null;
  if(startOvenInput){
    const rel=physicalToRelative(Number(startOvenInput),battery);
    const pos=findSeriesPosition(rel);
    if(!pos) return toast("Start oven not in sequence series","error");
    cursor={series:pos.series,indexInSeries:pos.indexInSeries-1};
    if(cursor.indexInSeries<0){
      const si=SERIES_ORDER.indexOf(pos.series);
      const prev=SERIES_ORDER[(si-1+SERIES_ORDER.length)%SERIES_ORDER.length];
      cursor.series=prev;
      cursor.indexInSeries=SERIES[prev].length-1;
    }
  }else cursor=await findCursor(battery);
  const seq=generateSequence(cursor,total);
  const times=spreadTimes(start,total,480);
  state.generatedOvens=seq.map((s,i)=>({
    ovenNo:relativeToPhysical(s.relative,battery),
    pushTime:times[i],isManual:false,seriesTag:s.series,
    expectedRelative:s.relative,remarks:""
  }));
  renderScheduleTable();
  toast(`Generated ${total} ovens`,"success");
}

async function fetchOvenJobsFiltered(){

    .sort((a,b)=>((a.date||"")+(a.battery||"")+String(a.ovenNo||"")).localeCompare((b.date||"")+(b.battery||"")+String(b.ovenNo||"")));

// Show/hide loco and wagon fields based on selected change type
function toggleQCFields(){
  const typeEl=document.getElementById("qc-type");
  const locoField=document.getElementById("qc-locoField");
  const wagonField=document.getElementById("qc-wagonField");
  if(!typeEl||!locoField||!wagonField) return;
  const type=typeEl.value;
  if(type==="Loco Change"){
    locoField.classList.remove("hidden");
    wagonField.classList.add("hidden");
  }else if(type==="Wagon Change"){
    locoField.classList.add("hidden");
    wagonField.classList.remove("hidden");
  }else{
    // Both
    locoField.classList.remove("hidden");
    wagonField.classList.remove("hidden");
  }
}

async function saveQCChange(){

  const wagonNum=document.getElementById("qc-wagonNum")?.value.trim()||"";
  const effDate=document.getElementById("qc-effDate").value;
  const remarks=document.getElementById("qc-remarks").value.trim();

  if(type==="Loco Change" && !locoNum) return toast("Enter the new Loco number","error");
  if(type==="Wagon Change" && !wagonNum) return toast("Enter the new Wagon number","error");

  try{
    await FB.addDoc(FB.collection(FB.db,"qcChanges"),{
      battery:document.getElementById("qc-battery").value,
      date:effDate,

      changeType:type,
      newLocoNum:locoNum,
      newWagonNum:wagonNum,
      remarks:remarks,
      createdBy:p.name,
      createdAt:FB.serverTimestamp(),

async function loadBlendForDate(){
  const date=document.getElementById("cb-date").value;
  const plant=state.blendPlant;
  const docId=`${plant}_${date}`;
  try{
    const snap=await FB.getDoc(FB.doc(FB.db,"coalBlends",docId));
    if(!snap.exists()){
      document.querySelectorAll(".cb-default-pct").forEach(i=>i.value="");
      document.getElementById("cb-customs").innerHTML="";
      document.getElementById("cb-remarks").value="";
      updateBlendTotal();
      return;
    }
    const d=snap.data();
    document.querySelectorAll(".cb-default-pct").forEach(i=>i.value="");
    document.getElementById("cb-customs").innerHTML="";
    document.getElementById("cb-remarks").value=d.remarks||"";
    (d.components||[]).forEach(c=>{
      const def=document.querySelector(`.cb-default-pct[data-coal="${CSS.escape(c.coalName)}"]`);
      if(def) def.value=c.percentage;
      else{
        const div=document.createElement("div");
        div.className="grid grid-2"; div.style.marginBottom="8px";
        div.innerHTML=`
          <input value="${esc(c.coalName)}" class="cb-custom-name" readonly style="background:#eef2f7;font-weight:600;" />
          <div class="row" style="gap:6px;">
            <input class="cb-custom-pct" type="number" value="${c.percentage}" oninput="updateBlendTotal()" />
            <button class="small danger" onclick="this.closest('.grid').remove(); updateBlendTotal();">✕</button>
          </div>
        `;
        document.getElementById("cb-customs").appendChild(div);
      }
    });

async function saveBlend(){
  const p=state.profile;
  const date=document.getElementById("cb-date").value;
  const plant=state.blendPlant;
  const docId=`${plant}_${date}`;
  const components=[];
  document.querySelectorAll(".cb-default-pct").forEach(i=>{
    const v=Number(i.value||0);
    if(v) components.push({coalName:i.dataset.coal,percentage:v});
  });
  document.querySelectorAll("#cb-customs > div").forEach(d=>{
    const name=d.querySelector(".cb-custom-name")?.value.trim();
    const v=Number(d.querySelector(".cb-custom-pct")?.value||0);
    if(name&&v) components.push({coalName:name,percentage:v});
  });
  if(!components.length) return toast("Add at least one component","error");
  const total=components.reduce((a,c)=>a+c.percentage,0);
  if(Math.abs(total-100)>0.01) return toast(`Total must equal 100% for ${plant} (currently ${total}%)`,"error");
  try{
    await FB.setDoc(FB.doc(FB.db,"coalBlends",docId),{
      plant,date,effectiveFrom:date,
      components,remarks:document.getElementById("cb-remarks").value,
      createdBy:p.name,updatedAt:FB.serverTimestamp(),createdAt:FB.serverTimestamp()
    },{merge:true});
    toast("Coal blend saved ✔","success");
  }catch(e){ toast("Save failed: "+e.message,"error"); }
}

async function printCQGraphs(){
  const docs=await fetchQualityFiltered();
  if(!docs.length) return toast("No data","error");
  const from=document.getElementById("cqv-from").value;
  const to=document.getElementById("cqv-to").value;
  const selected=Array.from(document.querySelectorAll("[data-param].selected")).map(el=>el.dataset.param);
  if(!selected.length) return toast("Select at least one parameter","error");
  const w=window.open("","_blank");
  let chartsHTML="";
  for(const key of selected){
    const info=MASTER.CQ_PARAMS.find(p=>p.key===key);
    chartsHTML+=`<div class="blk"><div class="blk-head">${esc(info.label)} — Trend</div><div style="height:280px;"><canvas id="chart-${key}"></canvas></div></div>`;
  }
  const script=`<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>
  <script>
    const labels=${JSON.stringify(docs.map(d=>d.date))};
    ${selected.map(key=>{const info=MASTER.CQ_PARAMS.find(p=>p.key===key);const data=docs.map(d=>Number(d[key]||0));
      return `new Chart(document.getElementById('chart-${key}').getContext('2d'),{type:'line',data:{labels,datasets:[{label:'${info.label}',data:${JSON.stringify(data)},borderColor:'${info.color}',backgroundColor:'${info.color}22',tension:.3,fill:true,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}}}}});`;
    }).join("")}
    setTimeout(()=>window.print(),800);
  <\/script>`;
  w.document.write(`<html><head><title>Coke Quality Graphs</title>${printStyles()}</head><body>
    ${printHeaderHTML("Coke Quality Index — Graphs",`${from} to ${to}`)}
    ${chartsHTML}
    ${printFooterHTML()}
    ${script}
  </body></html>`);
  w.document.close();
}
function toggleCQParam(param,el){ el.classList.toggle("selected"); drawCokeQualityChart(); }
async function drawCokeQualityChart(){
  const canvas=document.getElementById("cqChart"); if(!canvas) return;
  try{
    const snap=await FB.getDocs(FB.collection(FB.db,"cokeQuality"));
    const docs=snap.docs.map(d=>d.data()).filter(d=>d.date).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const labels=docs.map(d=>d.date);
    const selectedParams=Array.from(document.querySelectorAll("[data-param].selected")).map(el=>el.dataset.param);
    const datasets=selectedParams.map(p=>{
      const info=MASTER.CQ_PARAMS.find(x=>x.key===p);
      return {label:info?info.label:p.toUpperCase(),data:docs.map(d=>Number(d[p]||0)),borderColor:info?info.color:"#0f2942",tension:.3};
    });
    if(state.chartCQ) state.chartCQ.destroy();
    state.chartCQ=new Chart(canvas.getContext("2d"),{type:"line",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom",labels:{font:{size:12}}}},scales:{x:{grid:{display:false}},y:{grid:{color:"#e5ecf3"}}}}});
  }catch(e){ console.warn(e); }
}

async function renderUsers(){
  if(state.profile.role!=="admin"){
    document.getElementById("pageContent").innerHTML=`<div class="card"><div class="card-body"><div class="msg error">Only admin.</div></div></div>`;
    return;
  }
  document.getElementById("pageContent").innerHTML=`
    <div class="card">
      <div class="card-head"><h2>👥 User Management</h2><div class="tag">Admin</div></div>
      <div class="card-body">
        <div class="subtabs">
          <div class="subtab active" onclick="loadUsers('pending',this)">Pending</div>
          <div class="subtab" onclick="loadUsers('approved',this)">Approved</div>
          <div class="subtab" onclick="loadUsers('rejected',this)">Rejected</div>
        </div>
        <div id="usersList">Loading…</div>
      </div>
    </div>
  `;
  loadUsers("pending");
}
async function loadUsers(status,tabEl){
  if(tabEl){
    document.querySelectorAll("#pageContent .subtab").forEach(t=>t.classList.remove("active"));
    tabEl.classList.add("active");
  }
  const el=document.getElementById("usersList");
  el.textContent="Loading…";
  try{
    const q=FB.query(FB.collection(FB.db,"users"),FB.where("status","==",status));
    const snap=await FB.getDocs(q);
    if(snap.empty){ el.innerHTML=`<div style="color:var(--muted);padding:20px 0;">No ${status} users.</div>`; return; }
    el.innerHTML=`
      <table><thead><tr><th>Name</th><th>Designation</th><th>Phone</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody>${snap.docs.map(d=>{
        const u=d.data(); const uid=d.id;
        return `<tr><td>${esc(u.name)}</td><td>${esc(u.designation)}</td><td>${esc(u.phone||"—")}</td><td>${esc(u.email)}</td>
          <td><span class="pill blue">${esc(u.role)}</span></td>
          <td>${status!=="approved"?`<button class="small success" onclick="updateUserStatus('${uid}','approved')">Approve</button>`:""}
          ${status!=="rejected"?`<button class="small danger" onclick="updateUserStatus('${uid}','rejected')" style="margin-left:6px;">Reject</button>`:""}</td>
        </tr>`;
      }).join("")}</tbody></table>`;
  }catch(e){ el.innerHTML=`<div class="msg error">${esc(e.message)}</div>`; }
}
async function updateUserStatus(uid,status){
  try{
    await FB.updateDoc(FB.doc(FB.db,"users",uid),{status,approvedBy:state.profile.name,approvedAt:FB.serverTimestamp()});
    toast("User "+status,"success");
    const activeTab=document.querySelector("#pageContent .subtab.active");
    const tabName=activeTab?activeTab.textContent.trim().toLowerCase():"pending";
    loadUsers(tabName);
  }catch(e){ toast(e.message,"error"); }
}
